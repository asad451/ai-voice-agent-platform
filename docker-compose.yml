services:
  postgres:
    image: postgres:16
    container_name: ai_voice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_voice_agent
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: